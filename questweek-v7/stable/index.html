goals.innerHTML=`<div class="hero"><h1>Goals</h1></div><div class="head"><h2>Countdowns</h2><button class="btn secondary" data-action="add-countdown">＋</button></div>${S.countdowns.map(x=>`<div class="card" style="margin-bottom:9px"><div class="count"><div><h3>${e(x.emoji)} ${e(x.name)}</h3><p class="muted">${e(x.date)}</p></div><strong>${Math.max(0,Math.ceil((new Date(x.date)-Date.now())/86400000))}d</strong></div><button class="btn secondary" data-edit-countdown="${e(x.id)}" style="margin-top:9px">Edit</button></div>`).join('')}<div class="head"><h2>Future You</h2></div>${S.goals.map(g=>{let p=Math.round(g.done.length/g.steps.length*100);return`<div class="card" style="margin-bottom:9px"><div class="count"><h3>${e(g.name)}</h3><b>${p}%</b></div><div class="bar"><span style="width:${p}%"></span></div>${g.steps.map((n,i)=>`<label style="display:block;margin-top:8px"><input type="checkbox" data-goal="${g.id}:${i}" ${g.done.includes(i)?'checked':''}> ${e(n)}</label>`).join('')}</div>`}).join('')}<div class="head"><h2>Challenges</h2></div>${S.challenges.map(x=>`<div class="card challenge"><div class="count"><div><h3>${e(x.name)}</h3><p class="muted">${x.value} / ${x.target} ${e(x.unit)}</p></div><button class="btn secondary" data-ch="${e(x.id)}">＋</button></div><div class="bar"><span style="width:${Math.min(100,x.value/x.target*100)}%"></span></div></div>`).join('')}`;
let hrs={};a.forEach(x=>{if(S.done[x.id]&&m(x.end)>m(x.start))hrs[x.c]=(hrs[x.c]||0)+m(x.end)-m(x.start)});let vals=D.map((_,i)=>a.filter(x=>x.d===i&&S.done[x.id]).reduce((n,x)=>n+(x.xp??X[x.c]??0),0)),mx=Math.max(1,...vals);progress.innerHTML=`<div class="hero"><h1>Progress</h1></div><div class="grid"><div class="stat"><span class="muted">Gym streak</span><strong>${streak('Gym')}</strong><span class="muted">days</span></div><div class="stat"><span class="muted">Programming streak</span><strong>${streak('Programming')}</strong><span class="muted">days</span></div></div><div class="card" style="margin-top:10px"><h2>Weekly XP</h2><div class="chart">${vals.map(v=>`<i style="height:${Math.max(3,v/mx*100)}%"></i>`).join('')}</div></div><div class="card" style="margin-top:10px"><h2>Time statistics</h2>${Object.entries(hrs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<p style="margin-top:8px">${I[k]||'•'} ${e(k)}: <b>${Math.floor(v/60)}h ${v%60}m</b></p>`).join('')||'<p class="muted" style="margin-top:8px">Complete tasks to build statistics.</p>'}</div><div class="card" style="margin-top:10px"><h2>Progress photos</h2><input id="photoInput" class="input" type="file" accept="image/*" multiple style="margin-top:9px"><div class="photoGrid" style="margin-top:9px">${S.photos.map(p=>`<img src="${p.data}">`).join('')}</div></div><div class="card" style="margin-top:10px"><h2>Life Timeline</h2><button class="btn secondary" data-action="add-timeline" style="margin-top:8px">Add event</button>${S.timeline.map(x=>`<p style="margin-top:10px"><b>${e(x.date)}</b><br>${e(x.text)}</p>`).join('')||'<p class="muted" style="margin-top:8px">Milestones appear here.</p>'}</div>`;
profile.innerHTML=`<div class="hero"><h1>Profile & Settings</h1></div><div class="card"><h2>Holiday Mode</h2><select id="hMode" class="input" style="margin-top:8px"><option value="normal" ${S.holiday.mode==='normal'?'selected':''}>Normal</option><option value="home" ${S.holiday.mode==='home'?'selected':''}>Holiday at Home</option><option value="away" ${S.holiday.mode==='away'?'selected':''}>Holiday Away</option></select><select id="hInt" class="input" style="margin-top:8px"><option value="relaxed" ${S.holiday.intensity==='relaxed'?'selected':''}>Relaxed</option><option value="balanced" ${S.holiday.intensity==='balanced'?'selected':''}>Balanced</option><option value="productive" ${S.holiday.intensity==='productive'?'selected':''}>Productive</option></select><div class="row wrap" style="margin-top:8px"><input id="hWake" class="input" type="time" value="${S.holiday.homeWake}"><input id="hSleep" class="input" type="time" value="${S.holiday.homeSleep}"><input id="aWake" class="input" type="time" value="${S.holiday.awayWake}"><input id="aSleep" class="input" type="time" value="${S.holiday.awaySleep}"></div><button class="btn" data-action="save-holiday" style="width:100%;margin-top:8px">Save</button></div><div class="grid" style="margin-top:10px"><div class="card"><h2>Money</h2><h1 style="margin-top:7px">${Number(S.money).toLocaleString('en-DK')} DKK</h1><input id="money" class="input" type="number" value="${S.money}" style="margin-top:8px"><button class="btn" data-action="save-money" style="width:100%;margin-top:8px">Save</button></div><div class="card"><h2>Weekly XP goal</h2><h1 style="margin-top:7px">${S.xpGoal}</h1><input id="xpGoal" class="input" type="number" value="${S.xpGoal}" style="margin-top:8px"><button class="btn" data-action="save-xp" style="width:100%;margin-top:8px">Save</button></div></div><div class="card" style="margin-top:10px"><h2>Burnout monitor</h2><div class="row" style="margin-top:8px"><input id="stress" class="input" type="number" min="1" max="5" value="${S.health.stress}"><input id="fatigue" class="input" type="number" min="1" max="5" value="${S.health.fatigue}"><input id="recovery" class="input" type="number" min="1" max="5" value="${S.health.recovery}"></div><button class="btn" data-action="save-health" style="width:100%;margin-top:8px">Save</button></div><div class="card" style="margin-top:10px"><h2>Evening review</h2><div class="row" style="margin-top:8px"><input id="mood" class="input" type="number" min="1" max="10" placeholder="Mood 1–10"><input id="energy" class="input" type="number" min="1" max="10" placeholder="Energy 1–10"></div><textarea id="review" class="input" style="margin-top:8px;min-height:80px" placeholder="What went well?"></textarea><button class="btn" data-action="save-review" style="width:100%;margin-top:8px">Save review</button></div><div class="card" style="margin-top:10px"><h2>Life Map</h2>${Object.entries(S.attrs).map(([k,v])=>`<div class="attr"><b>${e(k)}</b><div class="bar"><span style="width:${v}%"></span></div><span>${v}</span></div>`).join('')}</div><div class="card" style="margin-top:10px"><h2>Semester timetable</h2><button class="btn secondary" data-action="add-class" style="margin-top:8px">Add class</button>${S.timetable.map(x=>`<p style="margin-top:8px">${D[x.d]} ${x.start}–${x.end} ${e(x.t)}</p>`).join('')}</div><div class="card" style="margin-top:10px"><h2>Backup</h2><button class="btn secondary" data-action="export">Export</button> <label class="btn secondary">Import<input id="importFile" type="file" hidden></label></div>`;
wire(s)}
function open(h){sheet.innerHTML=h;modal.classList.add('show')}const close=()=>modal.classList.remove('show');
function editTask(k){let x=tasks().find(q=>q.id===k);if(!x)return;open(`<h2>Edit task</h2><input id="et" class="input" value="${e(x.t)}" style="margin-top:8px"><select id="ed" class="input" style="margin-top:8px">${D.map((n,i)=>`<option value="${i}" ${i===x.d?'selected':''}>${n}</option>`).join('')}</select><div class="row" style="margin-top:8px"><input id="es" class="input" type="time" value="${x.start||''}"><input id="ee" class="input" type="time" value="${x.end||''}"></div><select id="ec" class="input" style="margin-top:8px">${C.map(n=>`<option ${n===x.c?'selected':''}>${n}</option>`).join('')}</select><select id="el" class="input" style="margin-top:8px">${L.map(n=>`<option ${n===x.loc?'selected':''}>${n}</option>`).join('')}</select><div class="row" style="margin-top:8px"><button class="btn secondary" data-close>Cancel</button><button class="btn" data-save-task="${e(k)}">Save</button></div><button class="btn danger" data-delete-task="${e(k)}" style="width:100%;margin-top:8px">Remove</button>`)}
function wire(s){document.querySelectorAll('[data-check]').forEach(b=>b.onclick=q=>{q.stopPropagation();S.done[b.dataset.check]=!S.done[b.dataset.check];save();render()});document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>editTask(x.dataset.edit));document.querySelectorAll('[data-water]').forEach(b=>b.onclick=()=>{let d=day();S.water[d]=Math.max(0,Math.min(2500,(S.water[d]||0)+Number(b.dataset.water)));save();render()});if(s.add)smartAdd.onclick=()=>{S.custom.push({id:'sm'+id(),d:day(),t:s.add.name,start:s.add.start,end:s.add.end,c:s.add.cat,loc:'Home'});save();render()};document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{let x=S.challenges.find(q=>q.id===b.dataset.ch),n=Number(prompt(`Add ${x.unit}`,1));if(n>0){x.value=Math.min(x.target,x.value+n);save();render()}});document.querySelectorAll('[data-goal]').forEach(b=>b.onchange=()=>{let[k,i]=b.dataset.goal.split(':'),g=S.goals.find(q=>q.id===k),n=+i;g.done=b.checked?[...new Set([...g.done,n])]:g.done.filter(x=>x!==n);save();render()});if(photoInput)photoInput.onchange=q=>[...q.target.files].slice(0,3).forEach(f=>{let r=new FileReader();r.onload=()=>{S.photos.unshift({date:new Date().toISOString(),data:r.result});S.photos=S.photos.slice(0,24);save();render()};r.readAsDataURL(f)});if(importFile)importFile.onchange=async q=>{try{S=Object.assign(fresh(),JSON.parse(await q.target.files[0].text()));save();render()}catch{alert('Import failed')}}}
document.addEventListener('click',q=>{let b=q.target.closest('button,[data-action],[data-edit-countdown],[data-save-countdown],[data-delete-countdown],[data-save-task],[data-delete-task],[data-close]');if(!b)return;if(b.dataset.close!==undefined)close();if(b.dataset.saveTask){let k=b.dataset.saveTask,base=(S.holiday.mode==='normal'?normal():holiday(S.holiday.mode)).find(x=>x.id===k),data={t:et.value,d:+ed.value,start:es.value,end:ee.value,c:ec.value,loc:el.value};if(base)S.over[k]=data;else Object.assign(S.custom.find(x=>x.id===k)||{},data);save();close();render()}if(b.dataset.deleteTask){let k=b.dataset.deleteTask;if(S.custom.some(x=>x.id===k))S.custom=S.custom.filter(x=>x.id!==k);else S.over[k]={hidden:true};save();close();render()}if(b.dataset.action==='save-holiday'){Object.assign(S.holiday,{mode:hMode.value,intensity:hInt.value,homeWake:hWake.value,homeSleep:hSleep.value,awayWake:aWake.value,awaySleep:aSleep.value});save();render()}if(b.dataset.action==='save-money'){S.money=+money.value||0;save();render()}if(b.dataset.action==='save-xp'){S.xpGoal=+xpGoal.value||3000;save();render()}if(b.dataset.action==='save-health'){S.health={stress:+stress.value,fatigue:+fatigue.value,recovery:+recovery.value};save();render()}if(b.dataset.action==='save-review'){S.reviews.unshift({date:new Date().toISOString(),mood:+mood.value,energy:+energy.value,text:review.value});save();alert('Review saved')}if(b.dataset.action==='add-timeline'){let x=prompt('Life event');if(x){S.timeline.unshift({id:id(),date:new Date().toISOString().slice(0,10),text:x});save();render()}}if(b.dataset.action==='add-countdown')open(`<h2>Add countdown</h2><input id="ce" class="input" value="⏳" style="margin-top:8px"><input id="cn" class="input" placeholder="Name" style="margin-top:8px"><input id="cd" class="input" type="date" style="margin-top:8px"><button class="btn" data-action="save-new-countdown" style="width:100%;margin-top:8px">Save</button>`);if(b.dataset.action==='save-new-countdown'&&cn.value&&cd.value){S.countdowns.push({id:id(),name:cn.value,date:cd.value,emoji:ce.value||'⏳'});save();close();render()}if(b.dataset.editCountdown){let x=S.countdowns.find(q=>q.id===b.dataset.editCountdown);open(`<h2>Edit countdown</h2><input id="ce" class="input" value="${e(x.emoji)}" style="margin-top:8px"><input id="cn" class="input" value="${e(x.name)}" style="margin-top:8px"><input id="cd" class="input" type="date" value="${x.date}" style="margin-top:8px"><button class="btn" data-save-countdown="${x.id}" style="width:100%;margin-top:8px">Save</button><button class="btn danger" data-delete-countdown="${x.id}" style="width:100%;margin-top:8px">Delete</button>`)}if(b.dataset.saveCountdown){let x=S.countdowns.find(q=>q.id===b.dataset.saveCountdown);Object.assign(x,{emoji:ce.value,name:cn.value,date:cd.value});save();close();render()}if(b.dataset.deleteCountdown){S.countdowns=S.countdowns.filter(x=>x.id!==b.dataset.deleteCountdown);save();close();render()}if(b.dataset.action==='add-class')open(`<h2>Add class</h2><input id="cln" class="input" placeholder="Subject" style="margin-top:8px"><select id="cld" class="input" style="margin-top:8px">${D.slice(0,5).map((n,i)=>`<option value="${i}">${n}</option>`).join('')}</select><div class="row" style="margin-top:8px"><input id="cls" class="input" type="time"><input id="cle" class="input" type="time"></div><button class="btn" data-action="save-class" style="width:100%;margin-top:8px">Save</button>`);if(b.dataset.action==='save-class'&&cln.value&&cls.value&&cle.value){S.timetable.push({id:id(),d:+cld.value,t:cln.value,start:cls.value,end:cle.value});save();close();render()}if(b.dataset.action==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='questweek-v7-backup.json';a.click()}});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));scrollTo(0,0)});quickAdd.onclick=()=>document.querySelector('[data-view="profile"]').click();modal.onclick=q=>{if(q.target===modal)close()};render();
</script></body></html>
