<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>QuestWeek 4.2</title><style>:root{color-scheme:dark;--b:#080b12;--p:#121827;--p2:#192136;--t:#f7f8ff;--m:#98a4ba;--a:#7b5cff;--g:#52d88a;--l:#ffffff16;font-family:-apple-system,BlinkMacSystemFont,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t)}main{max-width:620px;margin:auto;padding:18px 15px 105px}h1,h2,p{margin:0}.top{display:flex;gap:11px;align-items:center;margin-bottom:15px}.logo{width:45px;height:45px;border-radius:15px;background:var(--a);display:grid;place-items:center;font-weight:900}.muted{color:var(--m);font-size:13px}.hero,.card,.task,.event{background:var(--p);border:1px solid var(--l);border-radius:20px}.hero,.card{padding:16px}.head{display:flex;justify-content:space-between;margin:20px 0 9px}.pill{padding:6px 9px;border-radius:999px;background:#7b5cff25;color:#baaaff;font-size:12px}.task{display:grid;grid-template-columns:43px 1fr auto;gap:10px;align-items:center;padding:10px;margin-bottom:8px}.ico{width:43px;height:43px;border-radius:13px;background:var(--p2);display:grid;place-items:center}.title{font-weight:750}.meta{color:var(--m);font-size:12px;margin-top:3px}.check{width:30px;height:30px;border-radius:50%;border:2px solid #ffffff33;background:none;color:white}.done{opacity:.55}.done .title{text-decoration:line-through}.btn{border:0;border-radius:12px;padding:11px;background:var(--a);color:white;font-weight:700}.input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--l);background:var(--p2);color:white}.row{display:flex;gap:8px}.row>*{flex:1}.tabs{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(calc(100% - 24px),596px);display:grid;grid-template-columns:repeat(3,1fr);padding:7px;background:#111623f2;border:1px solid var(--l);border-radius:20px}.tab{border:0;background:none;color:var(--m);padding:9px;border-radius:12px}.tab.active{background:#7b5cff25;color:white}.view{display:none}.view.active{display:block}.timeline{border-left:2px solid #7b5cff44;margin-left:10px;padding-left:16px}.event{padding:11px;margin-bottom:8px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(100%,620px);margin:auto;background:#111725;padding:18px 15px 25px;border-radius:22px 22px 0 0}@media(max-width:420px){.row{flex-direction:column}}</style></head><body><main><header class="top"><div class="logo">Q</div><div><h2>QuestWeek 4.2</h2><p class="muted">Breakfast + location-aware travel</p></div></header><section id="todayView" class="view active"><div class="hero"><span class="pill" id="day"></span><h1 style="margin-top:9px">Today</h1></div><div class="head"><h2>Schedule</h2><span class="pill">Tap to edit</span></div><div id="today"></div></section><section id="weekView" class="view"><div class="hero"><h1>Week</h1><p class="muted" style="margin-top:6px">Tasks reorder when their time changes.</p></div><div id="week"></div></section><section id="settingsView" class="view"><div class="hero"><h1>Planner</h1></div><div class="card" style="margin-top:10px"><h2>Tomorrow's school</h2><div class="row" style="margin-top:9px"><input id="ss" class="input" type="time"><input id="se" class="input" type="time"></div><button id="saveSchool" class="btn" style="width:100%;margin-top:9px">Save</button></div><div class="card" style="margin-top:10px"><h2>Travel rules</h2><p class="muted" style="margin-top:7px">Home → Gym: 40 min<br>Gym → School: 15 min<br>Home ↔ School: 40 min<br>School → Work: 30 min<br>Work → Home: 60 min</p></div></section></main><nav class="tabs"><button class="tab active" data-v="todayView">Today</button><button class="tab" data-v="weekView">Week</button><button class="tab" data-v="settingsView">Planner</button></nav><div id="modal" class="modal"><div class="sheet"><h2>Edit task</h2><input id="eid" type="hidden"><input id="et" class="input" style="margin-top:9px"><select id="ed" class="input" style="margin-top:9px"></select><div class="row" style="margin-top:9px"><input id="es" class="input" type="time"><input id="ee" class="input" type="time"></div><div class="row" style="margin-top:10px"><button id="cancel" class="btn" style="background:var(--p2)">Cancel</button><button id="saveEdit" class="btn">Save</button></div></div></div><script>'use strict';const K='qw42',D=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],I={Sleep:'🌙',Meditation:'🧘',Personal:'🍳',Commute:'🚌',Gym:'🏋️',Study:'📚',Work:'💼',Japanese:'🇯🇵',Badminton:'🏸',Boxing:'🥊',Endurance:'🏊',Programming:'💻',Chess:'♟️',Stretching:'🧎'};const di=()=>{let n=new Date().getDay();return n===0?6:n-1},m=t=>{let[a,b]=(t||'99:99').split(':').map(Number);return a*60+b},fmt=x=>x.start+'–'+x.end,sort=a=>[...a].sort((x,y)=>m(x.start)-m(y.start)||x.id.localeCompare(y.id));function base(){let A=[];function add(d,id,t,s,e,c){A.push({d,id,t,start:s,end:e,c})}for(let d=0;d<7;d++){add(d,'w'+d,'Wake up','05:30','05:35','Sleep');add(d,'med'+d,'Meditation','05:35','05:40','Meditation');add(d,'bf'+d,'Breakfast','05:40','05:55','Personal')}[['m',0,'Push workout'],['t',1,'Pull workout'],['f',4,'Upper workout']].forEach(x=>{add(x[1],x[0]+'r','Get ready','05:55','06:05','Personal');add(x[1],x[0]+'hg','Travel home → gym','06:05','06:45','Commute');add(x[1],x[0]+'g',x[2],'06:45','07:45','Gym');add(x[1],x[0]+'sh','Shower at gym','07:45','08:00','Personal');add(x[1],x[0]+'gs','Travel gym → school','08:00','08:15','Commute')});add(0,'s0','School','08:15','15:30','Study');add(0,'jp','Japanese class','17:15','19:05','Japanese');add(1,'s1','School','08:15','15:30','Study');add(1,'sw1','Travel school → work','15:30','16:00','Commute');add(1,'work1','Work','16:00','20:00','Work');add(1,'wh1','Travel work → home','20:00','21:00','Commute');add(2,'hs2','Travel home → school','07:35','08:15','Commute');add(2,'s2','School','08:15','15:30','Study');add(2,'sw2','Travel school → work','15:30','16:00','Commute');add(2,'work2','Work','16:00','20:00','Work');add(2,'wh2','Travel work → home','20:00','21:00','Commute');add(3,'bad','Badminton','16:30','18:00','Badminton');add(3,'legs','Legs workout','18:15','19:15','Gym');add(4,'s4','School','08:15','15:30','Study');add(4,'code','Cybersecurity / programming','18:00','19:30','Programming');add(5,'lower','Lower workout','09:00','10:15','Gym');add(5,'box','Boxing','12:00','13:00','Boxing');add(6,'iron','Ironman base','09:00','10:30','Endurance');for(let d=0;d<7;d++){add(d,'str'+d,'Stretching','21:10','21:20','Stretching');add(d,'bed'+d,'In bed','21:30','21:35','Sleep')}return A}let S;try{S=JSON.parse(localStorage.getItem(K))||{over:{},done:{},school:{}}}catch{S={over:{},done:{},school:{}}}const save=()=>localStorage.setItem(K,JSON.stringify(S));function tasks(){let A=base().map(x=>Object.assign({},x,S.over[x.id]||{}));let td=new Date();td.setDate(td.getDate()+1);let sc=S.school[td.toISOString().slice(0,10)],d=(di()+1)%7;if(sc){let q=A.find(x=>x.d===d&&x.t==='School');if(q){q.start=sc.start;q.end=sc.end}let hs=A.find(x=>x.d===d&&x.t.includes('→ school'));if(hs){hs.end=sc.start;let z=m(sc.start)-40;hs.start=String(Math.floor(z/60)).padStart(2,'0')+':'+String(z%60).padStart(2,'0')}let sw=A.find(x=>x.d===d&&x.t.includes('school → work'));if(sw){sw.start=sc.end;let z=m(sc.end)+30;sw.end=String(Math.floor(z/60)).padStart(2,'0')+':'+String(z%60).padStart(2,'0')}}return A}function card(x){return`<div class="task ${S.done[x.id]?'done':''}" data-id="${x.id}"><div class="ico">${I[x.c]||'•'}</div><div><div class="title">${x.t}</div><div class="meta">${fmt(x)}</div></div><button class="check" data-check="${x.id}">${S.done[x.id]?'✓':''}</button></div>`}function render(){let A=tasks(),d=di();day.textContent=D[d];today.innerHTML=sort(A.filter(x=>x.d===d)).map(card).join('');week.innerHTML=D.map((n,i)=>`<div class="head"><h2>${n}</h2></div><div class="timeline">${sort(A.filter(x=>x.d===i)).map(x=>`<div class="event" data-id="${x.id}"><b>${fmt(x)}</b><div>${I[x.c]||'•'} ${x.t}</div></div>`).join('')}</div>`).join('');let td=new Date();td.setDate(td.getDate()+1);let sc=S.school[td.toISOString().slice(0,10)];ss.value=sc?.start||'08:15';se.value=sc?.end||'15:30';document.querySelectorAll('[data-check]').forEach(b=>b.onclick=e=>{e.stopPropagation();S.done[b.dataset.check]=!S.done[b.dataset.check];save();render()});document.querySelectorAll('[data-id]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-check]'))return;let q=A.find(a=>a.id===x.dataset.id);eid.value=q.id;et.value=q.t;ed.value=q.d;es.value=q.start;ee.value=q.end;modal.classList.add('show')})}ed.innerHTML=D.map((x,i)=>`<option value="${i}">${x}</option>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.v))});cancel.onclick=()=>modal.classList.remove('show');saveEdit.onclick=()=>{S.over[eid.value]={t:et.value,d:+ed.value,start:es.value,end:ee.value};save();modal.classList.remove('show');render()};saveSchool.onclick=()=>{let td=new Date();td.setDate(td.getDate()+1);S.school[td.toISOString().slice(0,10)]={start:ss.value,end:se.value};save();render()};render();</script></body></html>
